server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset filenames carry a content hash, so they can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html points at those hashed files and must never be served from a
    # stale cache: otherwise a rebuilt UI keeps loading the previous bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The SPA owns client-side routing, so unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The browser never talks to PostgreSQL: every data access goes through the
    # Go API, proxied here so the UI can use same-origin requests.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Manual analysis and backtests can take a while on a local GPU.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
